name: Build & Release iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (ví dụ: v1.0.2)'
        required: true
        default: 'v1.0.2'
      release_notes:
        description: 'Ghi chú phiên bản (Release Notes)'
        required: false
        default: 'Cập nhật định danh phiên bản và đổi tên file IPA.'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build RobotNoiDia.ipa
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Determine Version & Release Notes
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
            NOTES="${{ github.event.inputs.release_notes }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/}"
            NOTES="Bản phát hành ${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG_VER="v1.0.2-${SHORT_SHA}"
            NOTES="Tự động build commit ${SHORT_SHA}"
          fi
          
          # Đảm bảo format vX.Y.Z cho tag và X.Y.Z cho marketing version
          if [[ $TAG_VER == v* ]]; then
            CLEAN_VER="${TAG_VER#v}"
          else
            CLEAN_VER="$TAG_VER"
            TAG_VER="v$TAG_VER"
          fi
          
          IPA_FILENAME="RobotNoiDia_${TAG_VER}.ipa"
          
          echo "VERSION=${TAG_VER}" >> $GITHUB_OUTPUT
          echo "CLEAN_VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "IPA_NAME=${IPA_FILENAME}" >> $GITHUB_OUTPUT
          echo "NOTES=${NOTES}" >> $GITHUB_OUTPUT
          
          echo "Build Version: ${TAG_VER} (Clean: ${CLEAN_VER}) -> File: ${IPA_FILENAME}"

      - name: Inject Version into Info.plist and Xcode Project
        run: |
          CLEAN_VER="${{ steps.vars.outputs.CLEAN_VERSION }}"
          RUN_NUM="${{ github.run_number }}"
          
          echo "Setting CFBundleShortVersionString to $CLEAN_VER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $CLEAN_VER" RobotNoiDia/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RUN_NUM" RobotNoiDia/Resources/Info.plist
          
          echo "Setting MARKETING_VERSION in project.pbxproj to $CLEAN_VER"
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $CLEAN_VER/g" RobotNoiDia.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $RUN_NUM/g" RobotNoiDia.xcodeproj/project.pbxproj

      - name: Build Archive (.xcarchive)
        run: |
          xcodebuild clean archive \
            -project RobotNoiDia.xcodeproj \
            -scheme RobotNoiDia \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/RobotNoiDia.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          find ./build/RobotNoiDia.xcarchive/Products/Applications -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
          ls -la Payload/
          
          IPA_FILE="${{ steps.vars.outputs.IPA_NAME }}"
          zip -r -9 "${IPA_FILE}" Payload
          ls -lh "${IPA_FILE}"

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.IPA_NAME }}
          path: ${{ steps.vars.outputs.IPA_NAME }}
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.VERSION }}
          name: Robot Nội Địa - ${{ steps.vars.outputs.VERSION }}
          body: |
            ### 🤖 Phiên bản: ${{ steps.vars.outputs.VERSION }}
            
            **Ghi chú phiên bản:**
            ${{ steps.vars.outputs.NOTES }}
            
            ---
            ### 📲 Tải và cài đặt:
            - **File cài đặt:** `${{ steps.vars.outputs.IPA_NAME }}` (đã cập nhật phiên bản **${{ steps.vars.outputs.CLEAN_VERSION }}** và icon Ecovacs Home chính thức).
            - Cài đặt qua **Sideloadly**, **ESign**, **Scarlet**, **AltStore** hoặc **TrollStore**.
          files: ${{ steps.vars.outputs.IPA_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
